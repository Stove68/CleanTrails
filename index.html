<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanTrails</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>

<header>
    <h1>🌿 CleanTrails</h1>
    <p>Saubere Wege sichtbar machen</p>
</header>

<main>

    <section>
        <h2>Willkommen</h2>

        <p>
            CleanTrails dokumentiert gereinigte Wege
            und macht Umweltengagement sichtbar.
        </p>
    </section>

    <div id="controls">
        <button id="startBtn">🟢 Sammelaktion starten</button>
        <button id="stopBtn">🔴 Sammelaktion beenden</button>
    </div>

    <div id="status">
        Bereit für eine Sammelaktion
    </div>

    <div id="stats">
        <h3>Statistik</h3>

        <p id="routeCount">
            Sammelaktionen: 0
        </p>

        <p id="distanceCount">
            📏 Strecke: 0 km
        </p>
    </div>

    <section>
        <h2>Karte</h2>
        <div id="map"></div>
    </section>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>

</body>
</html>
